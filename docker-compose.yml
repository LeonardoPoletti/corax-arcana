services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kybercorax
      POSTGRES_PASSWORD: kyber
      POSTGRES_DB: corax_arcana
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://kybercorax:kyber@db:5432/corax_arcana
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

volumes:
  db_data:
